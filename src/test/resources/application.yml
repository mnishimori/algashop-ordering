spring:
  application:
    name: ordering
  datasource:
    url: jdbc:h2:file:~/algashop-ordering;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: sa
    password: 123
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      settings.web-allow-others: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
